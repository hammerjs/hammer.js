<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Hammer.js Playground</title>
    <style>
      body {
        font: 14px/22px sans-serif;
        margin: 20px;
      }

      fieldset {
        display: inline-block;
        margin-bottom: 16px;
        vertical-align: top;
      }

      label {
        white-space: nowrap;
        margin-right: 10px;
      }

      #logger {
        font: 11px/16px monospace;
        white-space: pre;
        position: fixed;
        top: 10px;
        right: 10px;
        text-align: right;
        max-height: calc(100vh - 60px);
        overflow: hidden;
        opacity: 0.55;
        pointer-events: none;
      }

      #clearButton {
        position: fixed;
        bottom: 10px;
        right: 10px;
      }

      #hitarea {
        width: 340px;
        height: 340px;
        border: solid 2px;
        border-radius: 12px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        align-items: center;
        justify-content: center;
        cursor: grab;
      }

      #hitarea:active {
        cursor: grabbing;
      }
    </style>
  </head>
  <body>
    <form id="configForm">
      <fieldset>
        <legend>Pointer Types</legend>
        <label><input type="checkbox" id="touchCheckbox" /> Touch</label>
        <label><input type="checkbox" id="penCheckbox" /> Pen</label>
        <label><input type="checkbox" id="mouseCheckbox" /> Mouse</label>
      </fieldset>
      <fieldset>
        <legend>Scale Options</legend>
        <label><input type="checkbox" id="quickScaleCheckbox" checked /> Quick-Scale</label>
      </fieldset>
      <fieldset>
        <legend>Touch Action &amp; Scroll Coexistence</legend>
        <select id="touchActionSelect">
          <option value="compute">compute (Auto from recognizers)</option>
          <option value="pan-y pinch-zoom">pan-y pinch-zoom (Horizontal Carousel)</option>
          <option value="pan-x pan-y">pan-x pan-y (1-finger Scroll + Pinch)</option>
          <option value="manipulation">manipulation (Scroll + Zoom, No 300ms Delay)</option>
          <option value="none">none (Full 2D Canvas)</option>
        </select>
        <label
          ><input type="checkbox" id="horizontalOnlyCheckbox" /> Horizontal Pan/Fling Only</label
        >
      </fieldset>
    </form>

    <div id="logger"></div>
    <div id="hitarea">
      <span>Tap / Double-Tap / Pan / Fling / Scale / Rotate</span>
      <button id="childButton" type="button">Interactive Child Button</button>
    </div>

    <button id="clearButton" type="button">Clear Log</button>

    <script type="module">
      import Hammer from '../src/index.ts';

      const $ = selector => document.querySelector(selector);
      const $$ = selector => Array.from(document.querySelectorAll(selector));

      const logger = $('#logger');
      function writeLine(message) {
        logger.textContent = message + '\n' + logger.textContent;
      }

      $('#clearButton').onclick = () => {
        logger.textContent = '';
        console.clear();
      };

      $('#childButton').onclick = () => {
        writeLine('Native child <button> click!');
      };

      function logGesture(gesture) {
        return ev => {
          console.log(gesture, ev);
          const cleanEv = {...ev};
          delete cleanEv.originalEvent;
          delete cleanEv.motionEvent;
          writeLine(
            JSON.stringify(cleanEv, (_key, value) =>
              typeof value === 'number' ? Math.round(value * 100) / 100 : value
            ) +
              ' | ' +
              gesture
          );
        };
      }

      function installHammer(managerOptions, quickScale, horizontalOnly) {
        const hammer = new Hammer($('#hitarea'), managerOptions);
        const doubleTap = new Hammer.Tap({onTap: logGesture('DoubleTap')}, {taps: 2});
        const singleTap = new Hammer.Tap({
          onTap: logGesture('SingleTapConfirmed'),
        }).requireFailureOf(doubleTap);

        hammer
          .register(singleTap)
          .register(doubleTap)
          .register(
            new Hammer.LongPress({
              onLongPress: logGesture('LongPress'),
              onLongPressUp: logGesture('LongPressUp'),
            })
          );

        if (!horizontalOnly) {
          hammer
            .register(
              new Hammer.Scale(
                {
                  onScaleStart: logGesture('ScaleStart'),
                  onScale: logGesture('Scale'),
                  onScaleEnd: logGesture('ScaleEnd'),
                },
                {quickScale}
              )
            )
            .register(
              new Hammer.Rotate({
                onRotateStart: logGesture('RotateStart'),
                onRotate: logGesture('Rotate'),
                onRotateEnd: logGesture('RotateEnd'),
              })
            );
        }

        const direction = horizontalOnly ? 'horizontal' : 'all';
        hammer.register(new Hammer.Fling({onFling: logGesture('Fling')}, {direction})).register(
          new Hammer.Pan(
            {
              onPanStart: logGesture('PanStart'),
              onPan: logGesture('Pan'),
              onPanEnd: logGesture('PanEnd'),
            },
            {direction}
          )
        );
        return hammer;
      }

      let hammerInstance;

      function configureHammer() {
        const supportedPointerTypes = [];
        if ($('#touchCheckbox').checked) supportedPointerTypes.push('touch');
        if ($('#penCheckbox').checked) supportedPointerTypes.push('pen');
        if ($('#mouseCheckbox').checked) supportedPointerTypes.push('mouse');

        const touchAction = $('#touchActionSelect').value;
        const quickScale = $('#quickScaleCheckbox').checked;
        const horizontalOnly = $('#horizontalOnlyCheckbox').checked;

        if (hammerInstance) {
          hammerInstance.destroy();
        }
        hammerInstance = installHammer(
          {
            supportedPointerTypes,
            touchAction,
          },
          quickScale,
          horizontalOnly
        );

        writeLine(`Configured Hammer (touch-action="${$('#hitarea').style.touchAction}")`);
      }

      $$('input[type="checkbox"], select').forEach(control => {
        control.addEventListener('change', configureHammer);
      });

      const defaults = Hammer.DEFAULTS;
      $('#touchCheckbox').checked = defaults.supportedPointerTypes.includes('touch');
      $('#penCheckbox').checked = defaults.supportedPointerTypes.includes('pen');
      $('#mouseCheckbox').checked = defaults.supportedPointerTypes.includes('mouse');
      $('#touchActionSelect').value = defaults.touchAction;

      configureHammer();
    </script>
  </body>
</html>
